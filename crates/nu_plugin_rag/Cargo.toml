[package]
name = "nu_plugin_rag"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
reqwest = { version = "0.11", features = ["blocking", "json"] }
rayon = "1"
blake3 = "1"
pulldown-cmark = "0.9"
text-splitter = { version = "0.13", features = ["tokenizers"] }
tokenizers = { version = "0.19", features = ["http"] }
nu-plugin = "0.111"
nu-protocol = "0.111"
nu-engine = "0.111"
walkdir = "2"

# HNSW approximate nearest neighbor index for research prototype
hnsw_rs = "0.3.4"
anndists = "0.1.5"
